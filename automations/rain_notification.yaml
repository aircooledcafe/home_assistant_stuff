alias: Rain Rate Alert
description: Sends different notifications depending on the rain intensity.
triggers:
  - trigger: state
    entity_id: sensor.ws3900a_rain_rate
    not_to:
      - unknown
      - unavailable
      - '0'
      - '0.0'
actions:
  - choose:
      - conditions:
          - condition: numeric_state
            entity_id: sensor.ws3900a_rain_rate
            above: 0
            below: 5
          - condition: template
            value_template: >-
              {{(as_timestamp(now()) -
              as_timestamp(this.attributes.last_triggered)) | int(0) > 180 }}
        sequence:
          - action: notify.send_message
            target:
              entity_id: notify.iphone_17_pro_max
            data:
              title: Light Rain 🌦️
              message: >-
                Currently raining at {{ states('sensor.ws3900a_rain_rate') }}
                mm/h.
      - conditions:
          - condition: numeric_state
            entity_id: sensor.ws3900a_rain_rate
            above: 5
            below: 15
          - condition: template
            value_template: >-
              {{(as_timestamp(now()) -
              as_timestamp(this.attributes.last_triggered)) | int(0) > 180 }}
        sequence:
          - action: notify.send_message
            target:
              entity_id: notify.iphone_17_pro_max
            data:
              title: Moderate Rain 🌧️
              message: >-
                Waterproofs essential, raining at {{
                states('sensor.ws3900a_rain_rate') }} mm/h.
      - conditions:
          - condition: numeric_state
            entity_id: sensor.ws3900a_rain_rate
            above: 15
            below: 45
          - condition: template
            value_template: >-
              {{(as_timestamp(now()) -
              as_timestamp(this.attributes.last_triggered)) | int(0) > 180 }}
        sequence:
          - action: notify.send_message
            target:
              entity_id: notify.iphone_17_pro_max
            data:
              title: Heavy Rain! 🌧️🌧️
              message: >-
                Stay in it's too wet out there, raining at {{
                states('sensor.ws3900a_rain_rate') }} mm/h.
      - conditions:
          - condition: numeric_state
            entity_id: sensor.ws3900a_rain_rate
            above: 45
          - condition: template
            value_template: >-
              {{(as_timestamp(now()) -
              as_timestamp(this.attributes.last_triggered)) | int(0) > 180 }}
        sequence:
          - action: notify.send_message
            target:
              entity_id: notify.iphone_17_pro_max
            data:
              title: ‼️Torrential Rain‼️ ⛈️⛈️⛈️
              message: >-
                Panic it's basically a waterfall from the sky! Raining at {{
                states('sensor.ws3900a_rain_rate') }} mm/h 🌊🌊🌊.
